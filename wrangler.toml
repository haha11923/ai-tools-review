name = "ai-tools-review"
type = "static"
account_id = ""
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "hugo --minify --gc"
publish = "public"

[build.environment]
HUGO_VERSION = "0.147.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[[redirects]]
  from = "/old-reviews/*"
  to = "/reviews/:splat"
  status = 301
  force = true
