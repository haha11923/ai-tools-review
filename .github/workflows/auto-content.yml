name: Auto Generate Content

on:
  schedule:
    # Every day at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Generate New Content
        run: |
          # Run content generation script
          bash scripts/auto_generate_content.sh
          # Build the site
          hugo --minify --gc

      - name: Commit and Push
        run: |
          git config --global user.name "AI Tools Review Bot"
          git config --global user.email "bot@ai-tools-review.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-generated new AI tool reviews: $(date +%Y-%m-%d)"
          git push
