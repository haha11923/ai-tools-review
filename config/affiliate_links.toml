# ==================== 说明 ====================
# 
# 佣金类型说明:
# - subscription: 订阅分成 (通常 20-30%)
# - freemium: 免费增值转化
# - pay_per_use: 按使用量付费
# - commission: 销售佣金 (通常 4-10%)
# - enterprise: 企业定制方案
#
# 使用建议:
# 1. 替换为自己的联盟 ID
# 2. 根据目标市场选择合适的项目
# 3. 定期检查链接有效性
# 4. 遵守各平台的联盟政策
#
# 推荐的佣金比例:
# - AI 工具订阅: 20-30% (首年)
# - SaaS 产品: 20-40% (持续分成)
# - 实体产品: 4-10%
# - 教育课程: 30-50%
#
# 最佳实践:
# - 在"价格"和"CTA"部分自然插入链接
# - 使用对比表格展示不同选择
# - 添加"为什么选择这个"的理由
# - 定期更新链接和价格信息
